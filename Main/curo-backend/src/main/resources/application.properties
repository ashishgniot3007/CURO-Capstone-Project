spring.application.name=curo-backend
spring.datasource.url=jdbc:postgresql://curo-adarsh98358-4645.g.aivencloud.com:16532/defaultdb?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

server.port=8080
server.servlet.context-path=/api

logging.level.root=INFO
logging.level.com.curo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET:your-super-secret-key-change-this-in-production-with-env-var}
jwt.expiration=86400000
# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000