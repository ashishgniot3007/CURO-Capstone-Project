spring.application.name=curo-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/curo_db
spring.datasource.username=curo_user
spring.datasource.password=@123A
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

server.port=8080
server.servlet.context-path=/api

logging.level.root=INFO
logging.level.com.curo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET:your-super-secret-key-change-this-in-production-with-env-var}
jwt.expiration=86400000
